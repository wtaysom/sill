name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    name: backend tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Floor from backend/pyproject.toml (requires-python = ">=3.10") plus a
        # current release. The smoke tests need no DB or network.
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install backend with dev extras
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          # dev + diagnostics: without the latter, numpy is never installed
          # here, so test_contributor_tools.py's
          # test_memory_health_imports_cleanly_when_numpy_present always
          # skipif-skips in CI — the numpy-present import path of
          # memory_health.py would never run continuously, only the
          # numpy-absent (ImportError-hint) path. test_memory_health_gives_
          # install_hint_without_numpy stays exercised either way — it
          # forces the absent case deterministically via a sys.modules
          # sentinel, independent of what's actually installed.
          pip install -e '.[dev,diagnostics]'

      - name: Run pytest
        working-directory: backend
        run: pytest -v

  schema-identity:
    name: fresh init == baseline + upgrade
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build db image
        run: docker build -t sill-db backend

      - name: Boot fresh container (baked baseline + migrations + stamp)
        run: |
          docker run -d --name fresh \
            -e POSTGRES_USER=sill -e POSTGRES_PASSWORD=sill -e POSTGRES_DB=sill sill-db

      - name: Boot baseline-only container (simulated v0.1.0)
        run: |
          mkdir -p /tmp/base-init && cp backend/schema.sql /tmp/base-init/init.sql
          docker run -d --name base \
            -e POSTGRES_USER=sill -e POSTGRES_PASSWORD=sill -e POSTGRES_DB=sill \
            -v /tmp/base-init:/docker-entrypoint-initdb.d sill-db

      - name: Wait for init to complete on both databases
        run: |
          # Wait for the entrypoint's "init process complete" line, NOT pg_isready:
          # 000_schema.sql's seed block stalls ~150s retrying the compose-only
          # embeddings host, and pg_isready answers the temp init server mid-run.
          # On timeout: name the container and dump its logs (agent-legible failure).
          for c in fresh base; do
            ok=0
            for i in $(seq 1 140); do
              docker logs "$c" 2>&1 | grep -q "PostgreSQL init process complete" && { ok=1; break; }
              sleep 3
            done
            if [ "$ok" -ne 1 ]; then
              echo "::error::container '$c' never logged init completion within 420s — its init logs follow; look for a failed or stalled init script"
              docker logs "$c" 2>&1 | tail -60
              exit 1
            fi
            # Brief retry: the real server starts a moment after the temp one stops.
            for i in 1 2 3 4 5; do
              docker exec "$c" pg_isready -U sill -d sill && break || sleep 2
            done
            docker exec "$c" pg_isready -U sill -d sill
          done

      - name: Upgrade the baseline container via upgrade.sh
        run: SILL_DB_CONTAINER=base ./upgrade.sh --schema-only --no-verify

      - name: Diff schema dumps
        run: |
          docker exec fresh pg_dump -U sill -d sill --schema-only --no-owner --no-privileges > /tmp/fresh.sql
          docker exec base  pg_dump -U sill -d sill --schema-only --no-owner --no-privileges > /tmp/upgraded.sql
          diff /tmp/fresh.sql /tmp/upgraded.sql
          echo "schemas identical"

      - name: Exercise new v0.2.0 DB call shapes (fresh container)
        # backend/tests/ is all no-DB by design (see backend/tests/test_hook_safety.py's
        # docstring), so record_memory_reuse(), the session_activity upsert, and
        # touch_memory_access() have never actually run against Postgres before this
        # step. This job already has a live "fresh" container (baseline + migrations +
        # stamp) sitting right there post-upgrade-diff, so exercise each shape once
        # against it rather than adding a whole second DB-backed test harness.
        run: |
          set -e
          PSQL="docker exec fresh psql -U sill -d sill -v ON_ERROR_STOP=1"
          # A 768-dim zero vector for the NOT NULL `memories.embedding` column —
          # content doesn't matter for these three shapes, only that the row exists.
          ZERO_VEC="[$(printf '0,%.0s' $(seq 1 767))0]"

          echo "--- Shape 1: record_memory_reuse() writes a memory_reuse_events row ---"
          $PSQL -c "
            INSERT INTO memories (id, type, content, embedding, importance)
            VALUES ('11111111-1111-1111-1111-111111111111', 'semantic', 'ci smoke: reuse shape', '${ZERO_VEC}'::vector, 0.5);
            INSERT INTO semantic_memories (memory_id, confidence)
            VALUES ('11111111-1111-1111-1111-111111111111', 0.7);
          "
          $PSQL -c "SELECT record_memory_reuse('11111111-1111-1111-1111-111111111111'::uuid, 'ci-smoke-detector', 'memory_id', NULL, 'ci-smoke-session', '{}'::jsonb);"
          REUSE_COUNT=$($PSQL -t -A -c "SELECT COUNT(*) FROM memory_reuse_events WHERE memory_id = '11111111-1111-1111-1111-111111111111';")
          [ "$REUSE_COUNT" = "1" ] || { echo "::error::record_memory_reuse did not insert exactly one memory_reuse_events row (got $REUSE_COUNT)"; exit 1; }
          echo "OK: record_memory_reuse -> $REUSE_COUNT memory_reuse_events row"

          echo "--- Shape 2: session_activity upsert bookkeeping (prompt_count, session_started_at) ---"
          # Mirrors plugin/hooks/spontaneous-recall.py's track_session_time() query
          # verbatim (project/session_id literals substituted for its f-string ones).
          UPSERT_SQL="
            WITH up AS (
              INSERT INTO session_activity (project, session_id, last_prompt_at, session_started_at, prompt_count)
              VALUES ('ci-smoke-project', 'ci-smoke-sess', now(), now(), 1)
              ON CONFLICT (project) DO UPDATE SET
                session_id = 'ci-smoke-sess',
                last_prompt_at = now(),
                session_started_at = CASE WHEN session_activity.session_id = 'ci-smoke-sess'
                                          THEN session_activity.session_started_at ELSE now() END,
                prompt_count = CASE WHEN session_activity.session_id = 'ci-smoke-sess'
                                    THEN session_activity.prompt_count + 1 ELSE 1 END
              RETURNING prompt_count, session_started_at
            )
            SELECT prompt_count, session_started_at FROM up;
          "
          FIRST=$($PSQL -t -A -F'|' -c "$UPSERT_SQL")
          FIRST_COUNT="${FIRST%%|*}"
          FIRST_STARTED="${FIRST##*|}"
          [ "$FIRST_COUNT" = "1" ] || { echo "::error::session_activity first upsert: expected prompt_count=1, got $FIRST_COUNT"; exit 1; }

          SECOND=$($PSQL -t -A -F'|' -c "$UPSERT_SQL")
          SECOND_COUNT="${SECOND%%|*}"
          SECOND_STARTED="${SECOND##*|}"
          [ "$SECOND_COUNT" = "2" ] || { echo "::error::session_activity second upsert (same session): expected prompt_count=2, got $SECOND_COUNT"; exit 1; }
          [ "$SECOND_STARTED" = "$FIRST_STARTED" ] || { echo "::error::session_activity second upsert: session_started_at moved within the same session ($FIRST_STARTED -> $SECOND_STARTED)"; exit 1; }
          echo "OK: session_activity prompt_count 1 -> 2, session_started_at held steady ($FIRST_STARTED)"

          echo "--- Shape 3: touch_memory_access() increments access_count, leaves importance untouched ---"
          # Migration-005 regression guard: the old trg_importance_on_access trigger
          # multiplied importance on every access; migration 005 dropped it in favor
          # of this function, which must touch ONLY access telemetry. A non-default
          # importance (0.42) makes a silent reset-to-default also show up as a fail.
          $PSQL -c "
            INSERT INTO memories (id, type, content, embedding, importance)
            VALUES ('22222222-2222-2222-2222-222222222222', 'semantic', 'ci smoke: access shape', '${ZERO_VEC}'::vector, 0.42);
            INSERT INTO semantic_memories (memory_id, confidence)
            VALUES ('22222222-2222-2222-2222-222222222222', 0.7);
          "
          BEFORE=$($PSQL -t -A -F'|' -c "SELECT access_count, importance FROM memories WHERE id = '22222222-2222-2222-2222-222222222222';")
          BEFORE_COUNT="${BEFORE%%|*}"
          BEFORE_IMPORTANCE="${BEFORE##*|}"
          $PSQL -c "SELECT touch_memory_access('22222222-2222-2222-2222-222222222222'::uuid);"
          AFTER=$($PSQL -t -A -F'|' -c "SELECT access_count, importance FROM memories WHERE id = '22222222-2222-2222-2222-222222222222';")
          AFTER_COUNT="${AFTER%%|*}"
          AFTER_IMPORTANCE="${AFTER##*|}"
          [ "$AFTER_COUNT" = "$((BEFORE_COUNT + 1))" ] || { echo "::error::touch_memory_access: access_count did not increment by 1 ($BEFORE_COUNT -> $AFTER_COUNT)"; exit 1; }
          [ "$AFTER_IMPORTANCE" = "$BEFORE_IMPORTANCE" ] || { echo "::error::touch_memory_access: importance CHANGED ($BEFORE_IMPORTANCE -> $AFTER_IMPORTANCE) — migration-005 regression: access must be telemetry-only"; exit 1; }
          echo "OK: touch_memory_access -> access_count $BEFORE_COUNT -> $AFTER_COUNT, importance held at $AFTER_IMPORTANCE"
