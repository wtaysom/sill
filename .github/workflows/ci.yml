name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    name: backend tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Floor from backend/pyproject.toml (requires-python = ">=3.10") plus a
        # current release. The smoke tests need no DB or network.
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install backend with dev extras
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          # dev + diagnostics: without the latter, numpy is never installed
          # here, so test_contributor_tools.py's
          # test_memory_health_imports_cleanly_when_numpy_present always
          # skipif-skips in CI — the numpy-present import path of
          # memory_health.py would never run continuously, only the
          # numpy-absent (ImportError-hint) path. test_memory_health_gives_
          # install_hint_without_numpy stays exercised either way — it
          # forces the absent case deterministically via a sys.modules
          # sentinel, independent of what's actually installed.
          pip install -e '.[dev,diagnostics]'

      - name: Run pytest
        working-directory: backend
        run: pytest -v

  clean-wheel:
    name: clean wheel (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build and install wheel outside checkout
        run: |
          python -m pip wheel --no-deps ./backend -w /tmp/sill-wheel
          python -m venv /tmp/sill-wheel-env
          /tmp/sill-wheel-env/bin/pip install /tmp/sill-wheel/*.whl
          cp backend/tests/wheel_smoke.py /tmp/sill-wheel-smoke.py
          cd /tmp
          /tmp/sill-wheel-env/bin/python -I /tmp/sill-wheel-smoke.py

  schema-identity:
    name: actual initdb and tagged data-bearing upgrades
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e './backend[dev,diagnostics]'
      - name: Build current extension image and deterministic HTTP fixture
        run: |
          docker build -t sill-test-db backend
          docker pull python:3.12-slim
      - name: Required real-initdb schema contract
        env:
          SILL_SCHEMA_REQUIRED: "1"
          SILL_SCHEMA_IMAGE: sill-test-db
          SILL_SCHEMA_HTTP_IMAGE: python:3.12-slim
        run: python -m pytest backend/tests/integration/test_schema_contract.py -v --basetemp=/tmp/sill-schema-evidence
      - name: Save init logs and unfiltered schema evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schema-contract-evidence
          path: /tmp/sill-schema-evidence
      - name: Start explicitly disposable transactional fixture
        run: |
          docker run -d --name sill_test_ci -p 127.0.0.1:15434:5432 \
            --add-host host.docker.internal:host-gateway \
            -e POSTGRES_USER=sill_test -e POSTGRES_PASSWORD=fixture_only \
            -e POSTGRES_DB=sill_test_control sill-test-db
          for i in $(seq 1 420); do
            docker logs sill_test_ci 2>&1 | grep 'PostgreSQL init process complete' >/dev/null && break
            sleep 1
          done
          docker logs sill_test_ci 2>&1 | grep 'PostgreSQL init process complete' >/dev/null
          for i in $(seq 1 30); do
            docker exec sill_test_ci pg_isready -U sill_test -d sill_test_control && break
            sleep 1
          done
          docker exec sill_test_ci pg_isready -U sill_test -d sill_test_control
      - name: Required transactional suite
        env:
          SILL_TEST_REQUIRED: "1"
          SILL_TEST_ALLOW_DATABASE: "1"
          SILL_TEST_CONTAINER: sill_test_ci
          SILL_TEST_DSN: postgresql://sill_test:fixture_only@127.0.0.1:15434/sill_test_control
        run: |
          python backend/tests/integration/bootstrap_fixture.py --name sill_test_ci_transactions --through 007
          export SILL_TEST_DSN=postgresql://sill_test:fixture_only@127.0.0.1:15434/sill_test_ci_transactions
          python -m pytest backend/tests/integration --ignore=backend/tests/integration/test_schema_contract.py -v
      - name: Remove owned transactional container
        if: always()
        run: docker rm -fv sill_test_ci || true

  native-linux-runtime:
    name: cold install and MCP round trip (Linux amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Required native runtime rehearsal with real TEI
        run: python -I .github/scripts/native_linux_runtime.py "${RUNNER_TEMP}/sill-native-evidence"
      - name: Save installer, initdb, readiness and MCP evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-linux-runtime-evidence
          path: ${{ runner.temp }}/sill-native-evidence
          if-no-files-found: error
