[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sill-memory"
version = "0.2.1"
description = "Sill — Postgres-backed persistent memory for AI agents (MCP + workers)."
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "William Taysom" },
  { name = "Sili" },
]
dependencies = [
  "asyncpg>=0.29.0",
  "psycopg2-binary>=2.9.9",
  "pgvector>=0.2.0",
  # Upper bound is load-bearing, not caution: sill_mcp_server.py registers its
  # tools through `Server.list_tools()`, an API mcp 2.x removed. An unpinned
  # `mcp>=1.0.0` resolves to 2.x on any fresh install, and the server then dies
  # at startup with "'Server' object has no attribute 'list_tools'" while
  # `sill-mcp --help` still exits 0. Found by the v0.2.0 clean-machine
  # acceptance rehearsal — see docs/RELEASE-REHEARSAL.md.
  "mcp>=1.0.0,<2",
  "python-dotenv>=1.0.0",
  "simplejson>=3.19",
  "tomlkit>=0.13.2",
  "tomli>=2.0.1; python_version < '3.11'",
  "requests>=2.31.0",
  "httpx>=0.25.0",
  "pydantic>=2.4.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4.3",
  "pytest-asyncio>=0.21.1",
]
diagnostics = [
  "numpy>=1.24",
]

[project.scripts]
sill = "sill_cli:main"
sill-mcp = "sill_mcp_server:main"
sill-worker = "worker:main"

[tool.setuptools]
py-modules = [
  "memory_tools",
  "embedding_profiles",
  "cognitive_memory_api",
  "prompt_resources",
  "sill",
  "sill_cli",
  "sill_mcp_server",
  "instance_config",
  "client_config",
  "provenance",
  "session_identity",
  "worker",
  "rabbit_bridge",
  "beat_worker",
  "memory_health",
  "ingest_md_memories",
]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["scripts*"]
