services:
  db:
    build: .
    container_name: ${SILL_DB_CONTAINER:-sill_db}
    # `unless-stopped`, not `always`: come back after a reboot, an engine
    # restart, or a crash, but stay down if the operator ran `compose stop`.
    # Without this the whole store is one OrbStack/Docker Desktop restart away
    # from being silently absent — spontaneous-recall degrades to a bare [TIME]
    # header, which is indistinguishable from "nothing relevant was found".
    restart: ${SILL_RESTART_POLICY:-unless-stopped}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sill}
      POSTGRES_USER: ${POSTGRES_USER:-sill}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sill_password}
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sill} -d ${POSTGRES_DB:-sill}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      # SILL_BIND_ADDR defaults to 0.0.0.0 — every interface, as before. This
      # database runs POSTGRES_HOST_AUTH_METHOD=trust, so anything that can
      # reach the port is a superuser on the whole store; set it to 127.0.0.1
      # in backend/.env unless another host genuinely needs to connect.
      - "${SILL_BIND_ADDR:-0.0.0.0}:${POSTGRES_PORT:-5432}:5432"
    command:
      - postgres
      - -c
      - search_path=ag_catalog,public
      - -c
      - app.embedding_dimension=${EMBEDDING_DIMENSION:-768}
    networks:
      - public
      - private

  embeddings:
    # Defaults are the amd64 release line. On an arm64 host (Apple Silicon)
    # that image runs under emulation — see backend/.env.example for the
    # native alternative and the tradeoff it carries.
    image: ${EMBEDDING_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:cpu-1.8}
    container_name: ${SILL_EMBEDDINGS_CONTAINER:-sill_embeddings}
    restart: ${SILL_RESTART_POLICY:-unless-stopped}
    platform: ${EMBEDDING_PLATFORM:-linux/amd64}
    command:
      - --model-id
      - ${EMBEDDING_MODEL_ID:-unsloth/embeddinggemma-300m}
      - --dtype
      - float32
    environment:
      EMBEDDING_MODEL_ID: ${EMBEDDING_MODEL_ID:-unsloth/embeddinggemma-300m}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-768}
    expose:
      - "80"
    volumes:
      - embeddings_cache:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      # First-time boot downloads ~300MB of safetensors when the upstream
      # repo has no ONNX files (Candle backend fallback). Give it plenty
      # of headroom — subsequent boots are near-instant.
      start_period: 600s
    networks:
      - private
      - public  # needed for initial model download from HuggingFace

  rabbitmq:
    image: rabbitmq:4-management
    container_name: ${SILL_RABBITMQ_CONTAINER:-sill_rabbitmq}
    restart: ${SILL_RESTART_POLICY:-unless-stopped}
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-sill}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-sill_password}
    ports:
      - "${SILL_BIND_ADDR:-0.0.0.0}:${RABBITMQ_PORT:-5672}:5672"
      - "${SILL_BIND_ADDR:-0.0.0.0}:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - public
      - private

  maintenance_worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: ${SILL_MAINTENANCE_WORKER_CONTAINER:-sill_maintenance_worker}
    restart: ${SILL_RESTART_POLICY:-unless-stopped}
    command: ["sill-worker", "--mode", "maintenance"]
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-sill}
      POSTGRES_USER: ${POSTGRES_USER:-sill}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sill_password}
      EMBEDDING_MODEL_ID: ${EMBEDDING_MODEL_ID:-unsloth/embeddinggemma-300m}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-768}
      RABBITMQ_ENABLED: "1"
      RABBITMQ_MANAGEMENT_URL: http://rabbitmq:15672
      RABBITMQ_USER: ${RABBITMQ_DEFAULT_USER:-sill}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-sill_password}
    networks:
      - private
      - public

volumes:
  postgres_data:
  embeddings_cache:
  rabbitmq_data:

networks:
  private:
    internal: true
  public:
