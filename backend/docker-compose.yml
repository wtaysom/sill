services:
  db:
    build: .
    container_name: ${SILL_DB_CONTAINER:-sill_db}
    # Resume after an engine restart and honor a deliberate `compose stop`.
    restart: ${SILL_RESTART_POLICY:-unless-stopped}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sill}
      POSTGRES_USER: ${POSTGRES_USER:-sill}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sill_password}
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5
      # The baseline may retry the embedding server during initdb. Do not
      # call that temporary socket-only PostgreSQL process healthy.
      start_period: ${SILL_INSTALL_WAIT_HEALTHY_S:-1800}s
    ports:
      # Postgres uses trust authentication. Only publish locally by default.
      - "${SILL_BIND_ADDR:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    command:
      - postgres
      - -c
      - search_path=ag_catalog,public
      - -c
      - app.embedding_dimension=${EMBEDDING_DIMENSION:-768}
    networks:
      - public
      - private

  embeddings:
    # Managed scripts select native defaults. Direct Compose defaults to amd64.
    image: ${EMBEDDING_IMAGE:-${SILL_DEFAULT_EMBEDDING_IMAGE:-ghcr.io/huggingface/text-embeddings-inference@sha256:8de25e75ce39617f17f2f6c77d60a4f75b65e779ed5005420eb1400072a15c1c}}
    container_name: ${SILL_EMBEDDINGS_CONTAINER:-sill_embeddings}
    restart: ${SILL_RESTART_POLICY:-unless-stopped}
    platform: ${EMBEDDING_PLATFORM:-${SILL_DEFAULT_EMBEDDING_PLATFORM:-linux/amd64}}
    command:
      - --model-id
      - ${EMBEDDING_MODEL_ID:-unsloth/embeddinggemma-300m}
      - --dtype
      - float32
      - --max-batch-tokens
      - ${EMBEDDING_MAX_BATCH_TOKENS:-2048}
    environment:
      REVISION: ${EMBEDDING_REVISION:-${SILL_DEFAULT_EMBEDDING_REVISION:-main}}
      EMBEDDING_MODEL_ID: ${EMBEDDING_MODEL_ID:-unsloth/embeddinggemma-300m}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-768}
    expose:
      - "80"
    volumes:
      - embeddings_cache:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      # Cold model downloads can take over 15 minutes. Match the managed
      # runtime's 30 minute default readiness budget.
      start_period: ${SILL_INSTALL_WAIT_HEALTHY_S:-1800}s
    networks:
      - private
      - public  # needed for initial model download from HuggingFace

  rabbitmq:
    image: rabbitmq:4-management
    container_name: ${SILL_RABBITMQ_CONTAINER:-sill_rabbitmq}
    restart: ${SILL_RESTART_POLICY:-unless-stopped}
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-sill}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-sill_password}
    ports:
      - "${SILL_BIND_ADDR:-127.0.0.1}:${RABBITMQ_PORT:-5672}:5672"
      - "${SILL_BIND_ADDR:-127.0.0.1}:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - public
      - private

  maintenance_worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: ${SILL_MAINTENANCE_WORKER_CONTAINER:-sill_maintenance_worker}
    restart: ${SILL_RESTART_POLICY:-unless-stopped}
    command: ["sill-worker", "--mode", "maintenance"]
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-sill}
      POSTGRES_USER: ${POSTGRES_USER:-sill}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sill_password}
      EMBEDDING_MODEL_ID: ${EMBEDDING_MODEL_ID:-unsloth/embeddinggemma-300m}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-768}
      RABBITMQ_ENABLED: "1"
      RABBITMQ_MANAGEMENT_URL: http://rabbitmq:15672
      RABBITMQ_USER: ${RABBITMQ_DEFAULT_USER:-sill}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-sill_password}
    networks:
      - private
      - public

volumes:
  postgres_data:
  embeddings_cache:
  rabbitmq_data:

networks:
  private:
    internal: true
  public:
